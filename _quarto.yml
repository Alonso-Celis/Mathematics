# Shared base — NO chapter list here. Each language profile
# (_quarto-es.yml, _quarto-en.yml, _quarto-fr.yml) provides its own
# book.chapters list, so Quarto's profile array-merge doesn't union
# them across languages.
# Always render with an explicit profile:
#   quarto render --profile es   (root /)
#   quarto render --profile en   (/en/)
#   quarto render --profile fr   (/fr/)

project:
  type: book
  output-dir: _site
  resources:
    - "assets/**"
    - "pdf/**"

book:
  # title / subtitle / language / page-footer set per-profile
  author: "Alonso Celis"
  reader-mode: true
  page-navigation: true
  search: true
  repo-url: https://github.com/Alonso-Celis/Mathematics
  repo-actions: [edit, source]
  downloads: [pdf]
  sidebar:
    style: docked
    collapse-level: 1
  navbar:
    background: primary
    pinned: true
    right:
      - text: "ES"
        href: /
      - text: "EN"
        href: /en/
      - text: "FR"
        href: /fr/
      - icon: github
        href: https://github.com/Alonso-Celis/Mathematics
        aria-label: GitHub
  # chapters: see _quarto-es.yml / -en.yml / -fr.yml

bibliography: references.bib

format:
  html:
    theme:
      light: [cosmo, assets/css/custom.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    smooth-scroll: true
    link-external-newwindow: true
    html-math-method: katex
    fig-cap-location: bottom
    tbl-cap-location: top
    crossrefs-hover: true
  pdf:
    documentclass: scrbook
    classoption:
      - twoside
      - openright
    papersize: a4
    geometry:
      - margin=2.5cm
    pdf-engine: xelatex
    number-sections: true
    toc: true
    toc-depth: 3
    colorlinks: true
    linkcolor: "Blue4"
    urlcolor: "Blue4"
    citecolor: "Blue4"
    keep-tex: false
    include-in-header:
      text: |
        % Math packages typically needed by Pandoc tex_math output
        \usepackage{amsmath,amssymb,amsthm,mathtools}
        \usepackage{dsfont}    % \mathds — kept for forward-compat if used
        % Wider line spacing for theorem-heavy text
        \linespread{1.15}\selectfont

# Theorem / proof crossref titles are set per-profile.

execute:
  freeze: auto
