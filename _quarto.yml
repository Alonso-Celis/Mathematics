# Shared base — NO chapter list here. Each language profile
# (_quarto-es.yml, _quarto-en.yml, _quarto-fr.yml) provides its own
# book.chapters list, so Quarto's profile array-merge doesn't union
# them across languages.
# Always render with an explicit profile:
#   quarto render --profile es   (root /)
#   quarto render --profile en   (/en/)
#   quarto render --profile fr   (/fr/)

project:
  type: book
  output-dir: _site
  resources:
    - "assets/**"
    - "pdf/**"

book:
  # title / subtitle / language / page-footer set per-profile
  author: "Alonso Celis"
  reader-mode: true
  page-navigation: true
  search: true
  repo-url: https://github.com/Alonso-Celis/Mathematics
  repo-actions: [edit, source]
  # downloads: [pdf]  # re-enable once TinyTeX is added to the CI runner
  sidebar:
    style: docked
    collapse-level: 1
  navbar:
    background: primary
    pinned: true
    right:
      - text: "ES"
        href: /
      - text: "EN"
        href: /en/
      - text: "FR"
        href: /fr/
      - icon: github
        href: https://github.com/Alonso-Celis/Mathematics
        aria-label: GitHub
  # chapters: see _quarto-es.yml / -en.yml / -fr.yml

bibliography: references.bib

format:
  html:
    theme:
      light: [cosmo, assets/css/custom.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    smooth-scroll: true
    link-external-newwindow: true
    html-math-method: katex
    fig-cap-location: bottom
    tbl-cap-location: top
    crossrefs-hover: true
  # pdf: re-add and enable TinyTeX in the workflow to ship per-language PDFs.

# Theorem / proof crossref titles are set per-profile.

execute:
  freeze: auto
