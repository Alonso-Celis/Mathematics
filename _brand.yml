# Brand palette inspired by UNAM identity — refine once logos are decoded
# and exact Pantones can be lifted from the source PDF.

color:
  palette:
    unam-blue: "#002147"     # azul universitario (placeholder)
    unam-gold: "#B89B4C"     # oro universitario (placeholder)
    ink: "#1A1A1A"
    paper: "#FBFAF6"
    muted: "#5F6770"
  primary: unam-blue
  secondary: unam-gold
  foreground: ink
  background: paper

typography:
  fonts:
    - family: "EB Garamond"
      source: google
      style: normal
      weight: [400, 500, 600, 700]
    - family: "Inter"
      source: google
      style: normal
      weight: [400, 500, 600, 700]
    - family: "JetBrains Mono"
      source: google
      style: normal
      weight: [400, 500]
  base:
    family: "EB Garamond"
    size: 18px
    line-height: 1.6
  headings:
    family: "Inter"
    weight: 600
    line-height: 1.25
  monospace:
    family: "JetBrains Mono"
    size: 0.92em
